<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050505}
body{overflow:hidden}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505}
#scene-load .wrap{cursor:default;height:min(74vh,900px);flex:none;margin-top:-1vh}
.btnbox{position:relative;flex:none;width:min(62vw,400px);aspect-ratio:900/370;margin-top:-1vh;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 2s ease,visibility 2s}
.btnbox.on{opacity:1;visibility:visible;pointer-events:auto}
.btnbox .stage{width:100%;margin-top:-17.5%}

.wrap{position:relative;height:min(96vh,1100px);aspect-ratio:800/990;max-width:98vw;max-height:calc(98vw*990/800);cursor:pointer}
.wrap>*{position:absolute;display:block;-webkit-user-drag:none;user-select:none}
#glow{left:8.5000%;top:3.8384%;width:82.5000%;height:78.7879%;filter:blur(16px);opacity:0}
#fin{left:8.5000%;top:3.8384%;width:82.5000%;height:78.7879%;opacity:0}
#txt{left:12.6250%;top:83.0303%;width:72.5000%;height:13.2323%;opacity:0;clip-path:inset(0 100% 0 0)}
#cv{left:0;top:0;width:100%;height:100%}


.stage{position:relative;width:min(96vw,900px);aspect-ratio:900/700}
.stage>*{position:absolute;display:block;-webkit-user-drag:none;user-select:none}
#top{left:7.000%;top:24.714%;width:22.556%;height:19.429%;z-index:1;will-change:transform}
#bot{left:4.111%;top:44.143%;width:26.556%;height:31.000%;z-index:3}
#fx{left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none}
#hit{left:7.000%;top:24.714%;width:22.556%;height:50.429%;z-index:6;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;border-radius:14px}
#hit:focus-visible{outline:2px solid #fff;outline-offset:3px}
#start{left:52.222%;top:30.857%;width:37.444%;height:13.286%;z-index:5;opacity:0;filter:blur(10px);transition:opacity 1.6s ease,filter 1.6s ease,transform .2s ease;pointer-events:none;background:none;border:0;padding:0;cursor:pointer}
#start img{width:100%;height:100%;display:block;transition:filter .25s}
#start.show{opacity:1;filter:blur(0);pointer-events:auto}
#start.show:hover img,#start.show:focus-visible img{filter:drop-shadow(0 0 9px rgba(255,255,255,.85))}
#start.show:active{transform:scale(.96)}
#start:focus-visible{outline:2px solid #fff;outline-offset:4px}

  for(let i=0;i<N;i++){const u=i/N,target=(i+.5)*STEP*gam;
    while(j<1499&&S.cum[j+1]<target)j++;
    const f=(target-S.cum[j])/Math.max(S.cum[j+1]-S.cum[j],1e-6),a=S.pts[j],b=S.pts[j+1];
    const fx=a[0]+(b[0]-a[0])*f,fy=a[1]+(b[1]-a[1])*f,w=ease(cl((t-T0-u*D)/R));
    pos[i]=[fx+(CENT[i][0]-fx)*w,fy+(CENT[i][1]-fy)*w];
    const m0=.22+.78*Math.abs(Math.cos(TAU*(2.2*u)-1.3*t));mm[i]=m0+(1-m0)*w;}
  draw(cl(t/FADE));}
function shiftAt(tau){const ramp=2.5,sh=tau<ramp?tau*tau/(2*ramp):tau-ramp/2;return SPEED*sh;}
function frameInf(t){
  clear();const tau=t-TM,tr=t-TR,g=LL/(N*STEP),rd=2.5;
  let sh=shiftAt(Math.min(tau,TR-TM));if(tr>0){const r=Math.min(tr,rd);sh+=SPEED*(r-r*r/(2*rd));}
  for(let i=0;i<N;i++){const u=i/N;let q=ease(cl((tau-u*1.6)/3.2));if(tr>0)q=1-ease(cl((tr-u*1.6)/3.2));
    const L=lem(i*STEP*g+sh);
    pos[i]=[CENT[i][0]+(L[0]-CENT[i][0])*q,CENT[i][1]+(L[1]-CENT[i][1])*q];
    const tw=.78+.22*Math.cos(TAU*(u*2)-.9*tau),mt=Math.max(.7,Math.min(1.6,WT/Math.max(WID[i],1)))*tw;
    mm[i]=1+(mt-1)*q;}
  draw(1);}
const pulse=g=>g<=0?0:(g<.35?g/.35*.5:.5*Math.pow(1-(g-.35)/.65,1.5));
function render(t){
  if(t<TM){frameIntro(t);
    const x=cl((t-(T0+D+R))/XF);fin.style.opacity=x;cv.style.opacity=1-x;cv.style.visibility=x>=1?'hidden':'visible';
  }else if(t<TE){
    const x=cl((t-TM)/.3);cv.style.visibility='visible';cv.style.opacity=x;fin.style.opacity=1-x;frameInf(t);
  }else{
    const x=cl((t-TE)/.5);frameInf(t);fin.style.opacity=x;cv.style.opacity=1-x;cv.style.visibility=x>=1?'hidden':'visible';}
  const k=cl((t-TXT0)/TXTD),e=1-Math.pow(1-k,2);txt.style.opacity=cl(k*3);txt.style.clipPath='inset(0 '+(100-100*e)+'% 0 0)';
  glow.style.opacity=Math.max(pulse(cl((t-GL0)/GLD)),t>=GL2?pulse(cl((t-GL2)/GLD)):0);}
let raf=0;
function play(){cancelAnimationFrame(raf);const t0=performance.now();
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){render(DONE+5);return;}
  (function f(n){const t=(n-t0)/1000;
    if(t>=END){render(DONE+5);return;}
    if(t>GL0+GLD+.2&&t<TM-.1){if(fin.style.opacity!=='1')render(DONE+5);}else render(t);
    raf=requestAnimationFrame(f);})(t0);}
if(atl.complete)play();else atl.onload=play;
window.__stopLoading=()=>cancelAnimationFrame(raf);

})();
</script>
<script>
(function(){

const OX=100,OY=250,SW=900,SH=700,NX=362,NY=495,EMIT=0.85;
const topEl=document.getElementById('top'),hit=document.getElementById('hit'),start=document.getElementById('start'),cv=document.getElementById('fx'),ctx=cv.getContext('2d');
let sc=1;
function fit(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;sc=r.width/SW*d;}
addEventListener('resize',fit);fit();
const R=(a,b)=>a+Math.random()*(b-a);
let P=[],emitting=0,last=0,running=false;
function spawn(n){
  for(let i=0;i<n;i++){
    const ang=R(-0.42,0.36),sp=R(260,820)*(Math.random()<.25?.55:1),big=Math.random()<.12;
    P.push({x:NX,y:NY+R(-5,5),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-R(0,40),r:big?R(3.5,6.5):R(1,3.4),sx:Math.random()<.4?R(1.15,1.5):1,life:0,max:R(3,5),mist:false,a:R(.6,1)});
  }
  for(let i=0;i<2;i++){
    const ang=R(-0.3,0.25),sp=R(160,420);
    P.push({x:NX,y:NY,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:R(28,60),sx:1,life:0,max:R(1.6,2.6),mist:true,a:R(.05,.1)});
  }
}
function frame(t){
  const dt=Math.min((t-last)/1000||0.016,.05);last=t;
  if(emitting>0){emitting-=dt;spawn(Math.round(2+10*Math.max(emitting,0)/EMIT));}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(sc,0,0,sc,-OX*sc,-OY*sc);ctx.globalCompositeOperation='lighter';
  P=P.filter(p=>p.life<p.max);
  for(const p of P){
    p.life+=dt;const u=p.life/p.max,dr=Math.exp(-(p.mist?2.6:1.5)*dt);
    p.vx*=dr;p.vy*=dr;p.vy+=(p.mist?10:240)*dt*(0.3+u);p.x+=p.vx*dt;p.y+=p.vy*dt;
    const f=Math.min(u/.06,1)*(1-u);
    if(p.mist){const rr=p.r*(1+u),g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);g.addColorStop(0,'rgba(255,255,255,'+p.a*f+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,7);ctx.fill();}
    else{ctx.fillStyle='rgba(255,255,255,'+p.a*f+')';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*p.sx,p.r,Math.atan2(p.vy,p.vx),0,7);ctx.fill();
      if(p.r>3){ctx.fillStyle='rgba(255,255,255,'+.12*f+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.4,0,7);ctx.fill();}}
  }
  if(P.length||emitting>0)requestAnimationFrame(frame);else running=false;
}
function go(){if(!running){running=true;last=performance.now();requestAnimationFrame(frame);}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false,shown=false;
async function press(){
  if(busy)return;busy=true;
  topEl.style.transition='transform .15s cubic-bezier(.5,0,.9,.6)';topEl.style.transform='translateY(33.8%)';
  await wait(190);
  topEl.style.transition='transform .42s cubic-bezier(.2,1.5,.4,1)';topEl.style.transform='translateY(0)';
  emitting=EMIT;go();
  await wait(700);busy=false;
  if(!shown){shown=true;await wait(300);start.classList.add('show');}
}
hit.addEventListener('click',press);
start.addEventListener('click',()=>document.dispatchEvent(new CustomEvent('start-pressed')));

})();
</script>
