<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الشارع الفرنسي</title>
<style>
html{background:linear-gradient(#050a1c,#0e1a40 30%,#2a3b6e 55%,#6a6495 80%,#b48aa0) fixed}
body{margin:0}
#c{position:fixed;inset:0;width:100%;height:100%}
#sp{height:800vh}
#v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#0000 55%,#0008)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:#e3b95c}

#ld{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#0b1226;color:#dfe6f5;font:600 17px system-ui,sans-serif;transition:opacity .8s}

<canvas id="c"></canvas><div id="sp"></div><div id="v"></div><div id="bar"></div><div id="hint">مرّر للأسفل ↓</div><div id="fade"></div><div id="ld">جارٍ تحميل الشارع…</div>

<script>
const T=THREE,$=i=>document.getElementById(i),rnd=Math.random,PI=Math.PI;
const mob=matchMedia('(pointer:coarse)').matches||innerWidth<700;
// ===== إعدادات قابلة للتعديل (المتجر / أبعاد الشارع) =====
const SHOP={name:'Jewel of Paris',frame:'#1f3d36',sign:'#e2c06a',stripe:['#a8322d','#f1e7d0']};
const ROAD=-1.9,Z0=.1,Z1=4.2,ZC=2.15,EYE=ROAD+1.2,XS=-12.5,XEND=12.5,BH=5.6,D=4;
let XE=9.7;
const SHOP_URL='shop.html',EXIT=location.hash=='#exit';   // ← غيّر SHOP_URL إذا سمّيت ملف المتجر باسم آخر
let DOOR,DOORFR,DOORHIT,MD2=null;
if(EXIT){history.scrollRestoration='manual';$('fade').style.opacity=1;$('ld').style.background='#000';$('ld').textContent='';document.documentElement.style.overflow='hidden'}

const R=new T.WebGLRenderer({canvas:$('c'),antialias:!mob,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,mob?1.5:2));R.setClearColor(0,0);
R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.12;
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.shadowMap.autoUpdate=false;
const S=new T.Scene();S.fog=new T.Fog(0x2a3b6e,13,60);
const cam=new T.PerspectiveCamera(60,1,.1,400);S.add(cam);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?72:58;cam.updateProjectionMatrix();XE=XEND-Math.min(9.5,Math.max(3,2.4/Math.tan(Math.atan(Math.tan(cam.fov*PI/360)*cam.aspect))))}
addEventListener('resize',rs);rs();

// ===== الإضاءة والشمس والظلال (الظلال تُحسب مرة واحدة لتخفيف الحمل على الهاتف) =====
S.add(new T.HemisphereLight(0x5a74b8,0x1c1a26,.6));
const sun=new T.DirectionalLight(0xa9c0ff,1.2),TC=new T.Vector3(.5,ROAD,ZC);
sun.position.copy(TC).addScaledVector(new T.Vector3(.49,.77,-.41),35);sun.target.position.copy(TC);S.add(sun,sun.target);
sun.castShadow=true;const sc=sun.shadow.camera;sc.left=sc.bottom=-20;sc.right=sc.top=20;sc.near=1;sc.far=90;
sun.shadow.mapSize.set(mob?1024:2048,mob?1024:2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.04;
const fill=new T.DirectionalLight(0x6a80c4,.32);fill.position.set(-30,12,3);S.add(fill);
const shopLight=new T.PointLight(0xffc98a,.8,9);shopLight.position.set(XEND-1.6,ROAD+1.8,ZC);S.add(shopLight);

// ===== أدوات الرسم على Canvas =====
const cv=(w,h,f,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t};
const path=(g,x,y,w,h,a)=>{g.beginPath();if(a){g.moveTo(x,y+h);g.lineTo(x,y+w/2);g.arc(x+w/2,y+w/2,w/2,PI,0);g.lineTo(x+w,y+h)}else g.rect(x,y,w,h);g.closePath()};
function win(g,x,y,w,h,fr,o={}){
 g.fillStyle=fr;
 if(o.hood){g.beginPath();g.moveTo(x-9,y-6);g.lineTo(x+w/2,y-24);g.lineTo(x+w+9,y-6);g.closePath();g.fill()}
 path(g,x-5,y-5,w+10,h+10,o.arch);g.fill();
 const k=g.createLinearGradient(x,y,x+w,y+h);k.addColorStop(0,'#9db2c8');k.addColorStop(.45,'#3f5066');k.addColorStop(1,'#1f2937');
 g.fillStyle=k;path(g,x,y,w,h,o.arch);g.fill();
 g.fillStyle=fr;g.fillRect(x+w/2-2,y,4,h);if(!o.arch)g.fillRect(x,y+h*.4,w,4);g.fillRect(x-9,y+h+5,w+18,7);
 if(o.box){g.fillStyle='#5b3b27';g.fillRect(x-8,y+h-10,w+16,18);for(let i=0;i<9;i++){g.fillStyle=i%3?'#2f6b34':'#c8283c';g.beginPath();g.arc(x-4+i*(w+8)/8,y+h-14,7,0,7);g.fill()}}
}
// واجهات مستوحاة من الصورة: 0 حجر كريمي + شرفات حديدية | 1 أوكر + أصص ورد | 2 كريمي + نوافذ كحلية
const PAL=[['#e3d2ab','#f4efe2'],['#d9a963','#f5f0e6'],['#e6dcc4','#27395a']];
function facade(st,shop){return cv(512,768,(g,W,Hh)=>{
 g.fillStyle=PAL[st][0];g.fillRect(0,0,W,Hh);
 for(let i=0;i<2500;i++){g.fillStyle=`rgba(80,60,30,${rnd()*.06})`;g.fillRect(rnd()*W,rnd()*Hh,2+rnd()*6,2+rnd()*3)}
 g.fillStyle='rgba(70,55,30,.13)';for(let y=14;y<Hh;y+=28)g.fillRect(0,y,W,1.5);
 const fr=PAL[st][1],gf=247,fh=(Hh-gf)/3,X=[74,224,374],gy=Hh-gf;
 for(let k=0;k<3;k++)X.forEach(x=>win(g,x,k*fh+36,64,104,fr,{hood:st==0&&k==1,box:st==1}));
 if(shop){g.fillStyle=SHOP.frame;g.fillRect(16,gy+8,480,gf-14);g.fillStyle='#16302a';g.fillRect(16,gy+8,480,50);
  g.fillStyle=SHOP.sign;g.font='700 36px Georgia,serif';g.textAlign='center';g.fillText(SHOP.name,256,gy+44);
  [[34,170],[308,170],[214,84]].forEach(([x,w],i)=>{const k=g.createLinearGradient(0,gy+70,0,Hh-14);k.addColorStop(0,'#ffe9b8');k.addColorStop(1,'#d89a4e');
   g.fillStyle=k;g.fillRect(x,gy+72,w,i<2?132:164);g.fillStyle='rgba(90,50,20,.45)';for(let s=0;s<3;s++)g.fillRect(x+8,gy+98+s*34,w-16,5)})}
 else if(st==0)X.forEach(x=>win(g,x,gy+36,64,150,fr,{arch:1}));
 else if(st==1){win(g,74,gy+60,64,110,'#4b2f20');win(g,224,gy+60,64,110,'#4b2f20');g.fillStyle='#4a2c22';path(g,360,gy+30,86,gf-60,1);g.fill();g.fillStyle='#00000040';g.fillRect(402,gy+80,2,gf-110)}
 else{g.fillStyle=fr;g.fillRect(190,gy+30,132,gf-48);g.fillStyle='#1b2a45';g.fillRect(198,gy+38,52,gf-64);g.fillRect(262,gy+38,52,gf-64);[74,374].forEach(x=>win(g,x,gy+50,64,110,fr))}
 g.fillStyle='#6d6454';g.fillRect(0,Hh-26,W,26);
})}
const roofT=(a,b)=>cv(128,128,(g,W)=>{g.fillStyle=a;g.fillRect(0,0,W,W);g.fillStyle=b;for(let x=0;x<W;x+=32)g.fillRect(x,0,2,W);g.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<W;y+=16)g.fillRect(0,y,W,1)},[1,1]);
const IRON=cv(128,64,g=>{g.strokeStyle='#1a1b1f';g.lineWidth=3;g.beginPath();g.moveTo(0,4);g.lineTo(128,4);g.moveTo(0,60);g.lineTo(128,60);for(let x=8;x<128;x+=16){g.moveTo(x,4);g.lineTo(x,60)}g.stroke();g.lineWidth=2;for(let x=0;x<128;x+=64){g.beginPath();g.arc(x+32,32,13,0,7);g.stroke()}},[1,1]);
const stoneM=c=>new T.MeshStandardMaterial({color:c,roughness:.95});
const BX=new T.BoxGeometry(1,1,1),BR=stoneM(0x8a5a44);
const bx=(m,a,b,c,x,y,z)=>{const o=new T.Mesh(BX,m);o.scale.set(a,b,c);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o};
const RF=[new T.MeshStandardMaterial({map:roofT('#8497b3','#667a96'),roughness:.6,metalness:.25,side:T.DoubleSide}),new T.MeshStandardMaterial({map:roofT('#5b6169','#454a52'),roughness:.8,side:T.DoubleSide})];
const IM=new T.MeshStandardMaterial({map:IRON,alphaTest:.5,side:T.DoubleSide,roughness:.5,metalness:.4});
const DM=new T.MeshStandardMaterial({map:cv(64,64,(g,W)=>{g.fillStyle='#e6dcc4';g.fillRect(0,0,W,W);win(g,16,12,32,40,'#f4efe2')}),roughness:.9});
const AW=new T.MeshStandardMaterial({map:cv(32,8,g=>{g.fillStyle=SHOP.stripe[0];g.fillRect(0,0,16,8);g.fillStyle=SHOP.stripe[1];g.fillRect(16,0,16,8)},[7,1]),roughness:.8});
const tri=new T.Shape();tri.moveTo(-.33,0);tri.lineTo(.33,0);tri.lineTo(0,.3);
const PG=new T.ExtrudeGeometry(tri,{depth:.5,bevelEnabled:false});
const FT={};
function fmat(st,shop){if(shop)return new T.MeshStandardMaterial({map:SHT,roughness:.85,emissive:0xffffff,emissiveMap:SHE,emissiveIntensity:.85});const k=st+'_'+!!shop;if(!FT[k]){const t=facade(st,shop);FT[k]=new T.MeshStandardMaterial({map:t,roughness:.9,emissive:shop?0xffffff:0,emissiveMap:shop?t:null,emissiveIntensity:.25})}return FT[k].clone()}
